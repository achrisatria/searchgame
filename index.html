<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Search Game HOKIJITU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: hsl(222,50%,4%);
    --hdr: hsl(222,50%,7%);
    --blue: hsl(213,94%,62%);
    --blue-dim: hsl(213,94%,62%,0.18);
    --blue-faint: hsl(213,94%,62%,0.1);
    --text: hsl(210,40%,95%);
    --muted: hsl(215,20%,38%);
    --card: hsl(222,44%,7%);
    --row-even: hsl(222,44%,7%);
    --row-odd: hsl(222,44%,6.2%);
    --divider: hsl(213,94%,62%,0.12);
    --border: hsl(213,94%,62%,0.2);
    --input-bg: hsl(222,50%,5%);
    --radius: 12px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Radial bg glow */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 80% 40% at 50% -10%, hsl(213,80%,18%,0.5) 0%, transparent 70%),
      radial-gradient(ellipse 60% 30% at 80% 80%, hsl(199,89%,14%,0.3) 0%, transparent 60%);
  }

  /* Grid mesh */
  body::after {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(hsl(213,94%,62%,0.025) 1px, transparent 1px),
      linear-gradient(90deg, hsl(213,94%,62%,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  /* Scan line */
  .scan-line {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, hsl(213,94%,70%,0.6), transparent);
    animation: scan 8s linear infinite;
    pointer-events: none; z-index: 9999;
  }

  @keyframes scan {
    0%   { transform: translateY(-10px); opacity: 0; }
    10%  { opacity: 0.4; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(100vh); opacity: 0; }
  }

  @keyframes shimmer-anim {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }

  @keyframes float-glow {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50%       { opacity: 0.8; transform: scale(1.1); }
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 20px hsl(213,94%,55%,0.4), 0 0 40px hsl(213,94%,55%,0.15); }
    50%  { box-shadow: 0 0 28px hsl(213,94%,55%,0.6), 0 0 56px hsl(213,94%,55%,0.25); }
    100% { box-shadow: 0 0 20px hsl(213,94%,55%,0.4), 0 0 40px hsl(213,94%,55%,0.15); }
  }

  @keyframes skeleton {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(180deg, hsl(222,50%,7%,0.97) 0%, hsl(213,50%,9%,0.94) 100%);
    border-bottom: 1px solid hsl(213,94%,62%,0.18);
    box-shadow: 0 1px 0 hsl(213,94%,62%,0.25), 0 4px 32px hsl(213,94%,30%,0.3), 0 16px 48px hsl(222,50%,3%,0.5);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .header-accent {
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, hsl(213,94%,70%,0.8) 30%, hsl(199,89%,70%,0.8) 70%, transparent);
  }

  .header-inner {
    max-width: 1300px; margin: 0 auto; padding: 0 24px;
    height: 72px;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 1;
  }

  .logo-area { display: flex; align-items: center; gap: 16px; }

  .logo-wrap {
    position: relative;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .logo-halo {
    position: absolute; inset: 0; border-radius: 50%;
    background: hsl(213,94%,55%,0.18);
    filter: blur(10px);
    animation: float-glow 3s ease-in-out infinite;
  }

  .logo-img {
    width: 40px; height: 40px;
    object-fit: contain;
    position: relative; z-index: 1;
    filter: drop-shadow(0 0 8px hsl(213,94%,65%,0.7)) brightness(1.08);
  }

  .brand h1 {
    font-size: 14px; font-weight: 900;
    letter-spacing: 0.22em; text-transform: uppercase; line-height: 1;
    background: linear-gradient(90deg, hsl(213,94%,75%), hsl(199,89%,90%) 30%, hsl(213,94%,80%) 50%, hsl(199,89%,90%) 70%, hsl(213,94%,75%));
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer-anim 4s linear infinite;
  }

  .brand p {
    display: flex; align-items: center; gap: 5px;
    margin-top: 4px; font-size: 9px; font-weight: 600;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: hsl(213,94%,55%);
  }

  .stats-badge {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 16px;
    background: linear-gradient(135deg, hsl(213,94%,62%,0.1), hsl(199,89%,55%,0.06));
    border: 1px solid hsl(213,94%,62%,0.25);
    box-shadow: 0 0 20px hsl(213,94%,55%,0.15), inset 0 1px 0 hsl(213,94%,80%,0.1);
  }

  .stats-badge .count { font-size: 14px; font-weight: 700; color: hsl(213,94%,82%); }
  .stats-badge .label { font-size: 12px; color: var(--muted); }
  .stats-badge .hash  { font-size: 14px; color: hsl(213,94%,68%); font-weight: 900; }

  /* ── MAIN ── */
  main {
    max-width: 1300px; margin: 0 auto;
    padding: 28px 24px; position: relative; z-index: 1;
  }

  /* ── FILTERS ── */
  .filters {
    background: linear-gradient(135deg, hsl(222,44%,9%,0.9), hsl(213,50%,11%,0.85));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px; margin-bottom: 24px;
    display: flex; flex-wrap: wrap; gap: 12px;
    backdrop-filter: blur(20px);
    box-shadow: 0 4px 32px hsl(213,94%,20%,0.2), inset 0 1px 0 hsl(213,94%,62%,0.15);
    position: relative; overflow: hidden;
  }

  .filters::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, hsl(213,94%,80%,0.2), transparent);
  }

  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px;
    color: hsl(213,94%,65%); stroke: hsl(213,94%,65%);
    pointer-events: none;
  }

  .filters input, .filters select {
    width: 100%; height: 40px; padding: 0 12px;
    background: var(--input-bg);
    border: 1px solid hsl(213,94%,62%,0.18);
    border-radius: var(--radius);
    color: var(--text); font-family: inherit; font-size: 14px;
    outline: none; transition: border-color 0.2s;
    box-shadow: inset 0 2px 12px hsl(222,50%,2%,0.6);
    appearance: none; -webkit-appearance: none;
  }

  .filters input { padding-left: 40px; }
  .filters input::placeholder { color: var(--muted); }
  .filters input:focus, .filters select:focus { border-color: hsl(213,94%,62%,0.5); }

  .select-wrap { position: relative; width: 200px; flex-shrink: 0; }
  .select-wrap-sm { position: relative; width: 160px; flex-shrink: 0; }

  .select-wrap select, .select-wrap-sm select { cursor: pointer; }

  .select-arrow {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    pointer-events: none; color: hsl(213,94%,65%);
  }

  .select-arrow svg { width: 14px; height: 14px; display: block; }

  .btn-csv {
    height: 40px; padding: 0 16px; flex-shrink: 0;
    background: linear-gradient(135deg, hsl(213,94%,55%,0.25), hsl(199,89%,50%,0.18));
    border: 1px solid hsl(213,94%,62%,0.35);
    border-radius: var(--radius);
    color: hsl(213,94%,80%); font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 0 16px hsl(213,94%,55%,0.15);
    transition: all 0.2s; white-space: nowrap;
  }

  .btn-csv:hover { background: linear-gradient(135deg, hsl(213,94%,55%,0.35), hsl(199,89%,50%,0.28)); }
  .btn-csv:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-csv svg { width: 15px; height: 15px; }

  /* ── TABLE ── */
  .table-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 0 0 1px hsl(213,94%,62%,0.06), 0 8px 40px hsl(213,94%,20%,0.3), 0 24px 80px hsl(222,50%,2%,0.7), inset 0 1px 0 hsl(213,94%,70%,0.12);
    position: relative;
  }

  .table-top-rim {
    position: absolute; top: 0; left: 32px; right: 32px; height: 1px; z-index: 5;
    background: linear-gradient(90deg, transparent, hsl(213,94%,70%,0.5), hsl(199,89%,70%,0.5), transparent);
  }

  /* Column header */
  .col-header {
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: linear-gradient(180deg, hsl(213,50%,13%), hsl(218,44%,10%));
    border-bottom: 1px solid hsl(213,94%,62%,0.2);
    position: relative;
  }

  .col-header-cell {
    padding: 16px 24px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    position: relative;
  }

  .col-header-cell:not(:last-child) { border-right: 1px solid var(--divider); }

  .col-header-cell .col-label {
    font-size: 10px; font-weight: 900; letter-spacing: 0.25em; text-transform: uppercase;
    color: hsl(213,94%,75%); position: relative; z-index: 1;
  }

  .col-header-cell .col-sub {
    font-size: 9px; color: hsl(215,20%,38%); position: relative; z-index: 1;
  }

  .col-bottom-accent {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 48px; height: 1px;
    background: linear-gradient(90deg, transparent, hsl(213,94%,62%,0.6), transparent);
  }

  /* Rows */
  .row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-bottom: 1px solid hsl(217,33%,10%);
    transition: background 0.15s, box-shadow 0.15s;
    position: relative; cursor: default;
  }

  .row:hover { background: var(--row-hover-color, transparent) !important; }

  .row-cell {
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }

  .row-cell:not(:last-child) { border-right: 1px solid var(--divider); }

  .provider-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-right: 8px;
    opacity: 0.7; transition: opacity 0.15s, box-shadow 0.15s;
  }

  .provider-name {
    font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    transition: color 0.15s;
  }

  .game-name {
    font-size: 14px; font-weight: 500;
    color: hsl(210,40%,88%); transition: color 0.15s;
  }

  .type-badge {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    padding: 4px 12px; border-radius: 99px;
    background: hsl(213,94%,62%,0.07);
    border: 1px solid hsl(213,94%,62%,0.18);
    color: hsl(213,94%,68%);
    transition: all 0.15s;
  }

  .row:hover .type-badge {
    background: hsl(213,94%,62%,0.15);
    border-color: hsl(213,94%,62%,0.4);
    color: hsl(213,94%,82%);
    box-shadow: 0 0 8px hsl(213,94%,55%,0.2);
  }

  .row:hover .game-name { color: hsl(210,40%,98%); }
  .row:hover .provider-dot { opacity: 1; }

  /* Left accent bar */
  .row-accent {
    display: none;
    position: absolute; left: 0; top: 0; bottom: 0; width: 2px; border-radius: 0 2px 2px 0;
  }

  .row:hover .row-accent { display: block; }

  /* Empty state */
  .empty {
    padding: 96px 0; text-align: center;
    color: var(--muted); font-size: 14px;
  }

  /* Skeleton */
  .skeleton-row { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid hsl(217,33%,11%); }
  .skeleton-cell { padding: 14px 24px; display: flex; justify-content: center; }
  .skeleton-cell:not(:last-child) { border-right: 1px solid var(--divider); }
  .skeleton-bar {
    height: 14px; border-radius: 99px;
    background: linear-gradient(90deg, hsl(217,33%,14%), hsl(213,40%,18%), hsl(217,33%,14%));
    background-size: 200% 100%;
    animation: skeleton 1.8s linear infinite;
  }

  /* ── PAGINATION ── */
  .pagination {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    border-top: 1px solid hsl(213,94%,62%,0.15);
    background: linear-gradient(180deg, var(--card), hsl(222,50%,6%));
  }

  .page-info { font-size: 12px; color: var(--muted); }
  .page-info b { color: hsl(213,94%,70%); font-weight: 700; }
  .page-controls { display: flex; align-items: center; gap: 8px; }

  .btn-page {
    height: 32px; padding: 0 10px;
    background: var(--input-bg);
    border: 1px solid hsl(213,94%,62%,0.2);
    border-radius: 8px;
    color: hsl(213,94%,68%); font-size: 12px; font-family: inherit; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 4px;
    transition: all 0.15s;
  }

  .btn-page:hover:not(:disabled) { border-color: hsl(213,94%,62%,0.4); color: hsl(213,94%,85%); }
  .btn-page:disabled { opacity: 0.35; cursor: not-allowed; }

  .page-indicator {
    height: 30px; padding: 0 16px;
    border: 1px solid hsl(213,94%,62%,0.3);
    border-radius: 8px;
    background: linear-gradient(135deg, hsl(213,94%,62%,0.12), hsl(199,89%,55%,0.08));
    color: hsl(213,94%,80%); font-size: 12px; font-weight: 700;
    display: flex; align-items: center;
  }
</style>
</head>

      <div class="brand">
        <h1>SEARCH GAME HOKIJITU</h1>
        <p>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/><rect x="2" y="14" width="8" height="8" rx="1"/><rect x="14" y="14" width="8" height="8" rx="1"/></svg>

      <span class="hash">#</span>

      <span class="label">Games</span>

</header>

<!-- MAIN -->
<main>
  <!-- Filters -->
  <div class="filters">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Cari nama game atau provider..." autocomplete="off" />
    </div>
    <div class="select-wrap">
      <select id="filter-provider">
        <option value="">Semua Provider</option>
      </select>
      <span class="select-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
    </div>
    <div class="select-wrap-sm">
      <select id="filter-type">
        <option value="">Semua Tipe</option>
      </select>
      <span class="select-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
    </div>
    <button class="btn-csv" id="btn-csv" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="csv-label">CSV</span>
    </button>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-top-rim"></div>
    <div class="col-header">
      <div class="col-header-cell">
        <span class="col-label">PROVIDER</span>
        <span class="col-sub">Penyedia Game</span>
        <div class="col-bottom-accent"></div>
      </div>
      <div class="col-header-cell">
        <span class="col-label">NAMA GAME</span>
        <span class="col-sub">Judul Permainan</span>
        <div class="col-bottom-accent"></div>
      </div>
      <div class="col-header-cell">
        <span class="col-label">TIPE</span>
        <span class="col-sub">Kategori</span>
        <div class="col-bottom-accent"></div>
      </div>
    </div>
    <div id="table-body"></div>
    <div id="pagination" class="pagination" style="display:none"></div>
  </div>
</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzCZ37G6Xz57I75KKqUxj0BC5QXsQmuZiSLHLPpg_MKchuNic3-__e0WahuAtE-OHEONQ/exec";
const PAGE_SIZE = 50;

const PALETTE = [
  [213,90,65],[175,72,54],[262,68,66],[160,62,52],
  [196,82,60],[350,65,62],[38,80,58],[240,64,66],
  [280,62,63],[25,78,60],[88,55,52],[330,60,60]
];

function hashProvider(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return h % PALETTE.length;
}

function providerColor(name) {
  const [h,s,l] = PALETTE[hashProvider(name)];
  return {
    text:     `hsl(${h},${s}%,${l}%)`,
    textHov:  `hsl(${h},${s}%,${l+14}%)`,
    dot:      `hsl(${h},${s}%,${l}%)`,
    dotGlow:  `hsl(${h},${s}%,${l}%,0.45)`,
    rowHover: `hsl(${h},${s}%,${l}%,0.055)`,
    accent:   `linear-gradient(180deg,hsl(${h},${s}%,${l+8}%,0.9),hsl(${h},${s}%,${l}%,0.7))`,
    border:   `hsl(${h},${s}%,${l}%,0.22)`,
  };
}

let allGames = [];
let filtered = [];
let page = 1;
let searchTimer = null;

// State
const state = { search: "", provider: "", type: "" };

async function loadData() {
  renderSkeleton();
  try {
    const resp = await fetch(GAS_URL);
    const json = await resp.json();
    if (!json.success) throw new Error(json.error || "Gagal memuat data");
    allGames = json.data;
    populateFilters();
    applyFilters();
  } catch (e) {
    document.getElementById("table-body").innerHTML =
      `<div class="empty">⚠️ Gagal memuat data. Coba refresh halaman.<br><small>${e.message}</small></div>`;
  }
}

function populateFilters() {
  const providers = [...new Set(allGames.map(g => g.provider))].sort();
  const types     = [...new Set(allGames.map(g => g.type))].filter(Boolean).sort();

  const pSel = document.getElementById("filter-provider");
  providers.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p; opt.textContent = p;
    pSel.appendChild(opt);
  });

  const tSel = document.getElementById("filter-type");
  types.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t; opt.textContent = t;
    tSel.appendChild(opt);
  });
}

function applyFilters() {
  const q = state.search.toLowerCase();
  filtered = allGames.filter(g => {
    if (q && !g.gameName.toLowerCase().includes(q) && !g.provider.toLowerCase().includes(q)) return false;
    if (state.provider && g.provider !== state.provider) return false;
    if (state.type && g.type !== state.type) return false;
    return true;
  });
  page = 1;
  render();
}

function render() {
  const total = filtered.length;
  document.getElementById("total-count").textContent = total.toLocaleString("id");

  // CSV button
  const btnCsv = document.getElementById("btn-csv");
  const csvLabel = document.getElementById("csv-label");
  btnCsv.disabled = total === 0;
  csvLabel.textContent = total > 0 ? `CSV (${total.toLocaleString("id")})` : "CSV";

  if (total === 0) {
    document.getElementById("table-body").innerHTML =
      `<div class="empty">Tidak ada game yang sesuai filter.</div>`;
    document.getElementById("pagination").style.display = "none";
    return;
  }

  const totalPages = Math.ceil(total / PAGE_SIZE);
  page = Math.min(page, totalPages);
  const slice = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  slice.forEach((game, i) => {
    const isEven = i % 2 === 0;
    const pc = providerColor(game.provider);

    const row = document.createElement("div");
    row.className = "row";
    row.style.background = isEven ? "#0f1624" : "#0d1420";
    row.style.setProperty("--row-hover-color", pc.rowHover);

    row.innerHTML = `
      <div class="row-accent" style="background:${pc.accent}"></div>
      <div class="row-cell" style="border-right:1px solid hsl(213,94%,62%,0.12)">
        <span class="provider-dot" style="background:${pc.dot};box-shadow:none" data-glow="${pc.dotGlow}"></span>
        <span class="provider-name" style="color:${pc.text}" data-hover="${pc.textHov}">${escHtml(game.provider)}</span>
      </div>
      <div class="row-cell" style="border-right:1px solid hsl(213,94%,62%,0.12)">
        <span class="game-name">${escHtml(game.gameName)}</span>
      </div>
      <div class="row-cell">
        <span class="type-badge">${escHtml(game.type || "—")}</span>
      </div>
    `;

    row.addEventListener("mouseenter", () => {
      row.style.boxShadow = `inset 0 0 0 1px ${pc.border},0 2px 16px ${pc.dotGlow}`;
      row.querySelector(".provider-dot").style.opacity = "1";
      row.querySelector(".provider-dot").style.boxShadow = `0 0 6px ${pc.dotGlow}`;
      row.querySelector(".provider-name").style.color = pc.textHov;
    });
    row.addEventListener("mouseleave", () => {
      row.style.boxShadow = "none";
      row.querySelector(".provider-dot").style.opacity = "0.7";
      row.querySelector(".provider-dot").style.boxShadow = "none";
      row.querySelector(".provider-name").style.color = pc.text;
    });

    tbody.appendChild(row);
  });

  // Pagination
  const pag = document.getElementById("pagination");
  if (totalPages <= 1) {
    pag.style.display = "none";
    return;
  }

  pag.style.display = "flex";
  pag.innerHTML = `
    <p class="page-info">
      Halaman <b>${page}</b> dari <b>${totalPages}</b> · Total <b>${total.toLocaleString("id")}</b> game
    </p>
    <div class="page-controls">
      <button class="btn-page" id="p-first" ${page===1?"disabled":""}>«</button>
      <button class="btn-page" id="p-prev" ${page===1?"disabled":""}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg> Prev</button>
      <div class="page-indicator">${page} / ${totalPages}</div>
      <button class="btn-page" id="p-next" ${page===totalPages?"disabled":""}>Next <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      <button class="btn-page" id="p-last" ${page===totalPages?"disabled":""}>»</button>
    </div>
  `;

  document.getElementById("p-first").onclick = () => { page = 1; render(); window.scrollTo(0,0); };
  document.getElementById("p-prev").onclick  = () => { page = Math.max(1, page-1); render(); window.scrollTo(0,0); };
  document.getElementById("p-next").onclick  = () => { page = Math.min(totalPages, page+1); render(); window.scrollTo(0,0); };
  document.getElementById("p-last").onclick  = () => { page = totalPages; render(); window.scrollTo(0,0); };
}

function renderSkeleton() {
  const widths = [[52,60,28],[40,70,22],[58,55,32],[44,65,25]];
  document.getElementById("table-body").innerHTML =
    Array.from({length:14}).map((_,i) => {
      const w = widths[i % widths.length];
      return `<div class="skeleton-row">
        <div class="skeleton-cell" style="border-right:1px solid hsl(213,94%,62%,0.12)"><div class="skeleton-bar" style="width:${w[0]}%"></div></div>
        <div class="skeleton-cell" style="border-right:1px solid hsl(213,94%,62%,0.12)"><div class="skeleton-bar" style="width:${w[1]}%"></div></div>
        <div class="skeleton-cell"><div class="skeleton-bar" style="width:${w[2]}%"></div></div>
      </div>`;
    }).join("");
  document.getElementById("pagination").style.display = "none";
}

function escHtml(s) {
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function downloadCSV() {
  if (!filtered.length) return;
  const header = ["Provider","Nama Game","Tipe"];
  const lines = [
    header.join(","),
    ...filtered.map(g =>
      [g.provider, g.gameName, g.type]
        .map(v => `"${String(v??'').replace(/"/g,'""')}"`)
        .join(",")
    )
  ];
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const hasFilter = state.search || state.provider || state.type;
  a.download = `hokijitu-games${hasFilter?"-filtered":"-all"}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// Events
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.search = e.target.value.trim(); applyFilters(); }, 300);
});

document.getElementById("filter-provider").addEventListener("change", e => {
  state.provider = e.target.value; applyFilters();
});

document.getElementById("filter-type").addEventListener("change", e => {
  state.type = e.target.value; applyFilters();
});

document.getElementById("btn-csv").addEventListener("click", downloadCSV);

// Init
loadData();
</script>
</body>

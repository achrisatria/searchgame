<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Game HOKIJITU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ── RESET ── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        * { scrollbar-width: none; -ms-overflow-style: none; }
        *::-webkit-scrollbar { display: none; }

        /* ── TOKENS ── */
        :root {
            --bg:        #07090f;
            --bg-card:   rgba(10,14,30,0.80);
            --border:    rgba(59,159,255,0.12);
            --border-h:  rgba(59,159,255,0.20);
            --blue:      #3b9fff;
            --blue-dim:  rgba(59,159,255,0.14);
            --blue-glow: rgba(59,159,255,0.35);
            --text:      #f0f4ff;
            --muted:     #5a6585;
            --radius:    16px;
        }

        /* ── BASE ── */
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 60px;
            overflow-x: hidden;
            position: relative;
        }

        /* ── BACKGROUND LAYERS ── */

        /* Dot grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(59,159,255,0.07) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        /* Bottom vignette */
        body::after {
            content: '';
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 160px;
            background: linear-gradient(to top, var(--bg), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* Glow blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 {
            width: 700px; height: 600px;
            top: -200px; left: 5%;
            background: radial-gradient(ellipse, rgba(59,159,255,0.12) 0%, transparent 70%);
            animation: floatBlob 8s ease-in-out infinite;
        }
        .blob-2 {
            width: 500px; height: 500px;
            bottom: -150px; right: 5%;
            background: radial-gradient(ellipse, rgba(30,100,220,0.09) 0%, transparent 70%);
            animation: floatBlob 11s ease-in-out infinite reverse;
        }
        .blob-3 {
            width: 300px; height: 300px;
            top: 40%; left: 55%;
            background: radial-gradient(ellipse, rgba(59,159,255,0.06) 0%, transparent 70%);
            animation: floatBlob 14s ease-in-out infinite 2s;
        }

        /* ── WRAP ── */
        .wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── HEADER ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 80px;
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
            flex-wrap: wrap;
            gap: 12px;
            background: linear-gradient(135deg, rgba(12,15,30,0.88) 0%, rgba(8,12,24,0.92) 100%);
            border: 1px solid var(--border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 8px 32px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.07),
                inset 0 0 0 1px rgba(255,255,255,0.03);
        }

        /* Shimmer line top */
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent,
                rgba(59,159,255,0.5),
                rgba(140,210,255,0.8),
                rgba(59,159,255,0.5),
                transparent
            );
            background-size: 200% auto;
            animation: shimmer 4s linear infinite;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 19px;
            color: var(--blue);
            background: linear-gradient(135deg, rgba(59,159,255,0.22), rgba(30,100,220,0.12));
            border: 1px solid rgba(59,159,255,0.35);
            box-shadow:
                0 0 24px rgba(59,159,255,0.30),
                inset 0 1px 0 rgba(255,255,255,0.15),
                inset 0 -1px 0 rgba(0,0,0,0.25);
            filter: drop-shadow(0 0 4px rgba(59,159,255,0.4));
        }

        .logo-text h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #fff 30%, rgba(59,159,255,0.85) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 3px;
        }

        .stat-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(59,159,255,0.10), rgba(30,100,220,0.06));
            border: 1px solid rgba(59,159,255,0.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .stat-box i {
            color: var(--blue);
            font-size: 14px;
            filter: drop-shadow(0 0 4px rgba(59,159,255,0.6));
        }

        .stat-inner span:first-child {
            display: block;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .stat-inner span:last-child {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.3;
        }

        /* ── SEARCH ── */
        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-field {
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .search-field i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 14px;
            transition: color .2s;
            pointer-events: none;
        }

        .search-field:focus-within i { color: var(--blue); }

        .search-field input {
            width: 100%;
            padding: 0 18px 0 44px;
            height: 52px;
            background: rgba(10,14,28,0.75);
            border: 1px solid rgba(59,159,255,0.13);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: border-color .2s, box-shadow .2s;
        }

        .search-field input::placeholder { color: var(--muted); }

        .search-field input:focus {
            border-color: rgba(59,159,255,0.45);
            box-shadow: 0 0 0 3px rgba(59,159,255,0.14), 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .btn-refresh {
            height: 52px;
            padding: 0 28px;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            color: #fff;
            background: linear-gradient(135deg, #2b8eff 0%, #1a6eee 100%);
            border-top: 1px solid rgba(255,255,255,0.20);
            box-shadow:
                0 0 24px rgba(43,142,255,0.35),
                0 4px 12px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.20);
            transition: transform .15s, box-shadow .15s;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 32px rgba(43,142,255,0.50),
                0 8px 20px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.20);
        }

        .btn-refresh:active { transform: translateY(0); }

        .btn-refresh:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        /* ── TABLE CARD ── */
        .table-card {
            display: flex;
            flex-direction: column;
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            background: linear-gradient(160deg, rgba(10,14,30,0.78) 0%, rgba(7,10,22,0.92) 100%);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 24px 64px rgba(0,0,0,0.50),
                inset 0 1px 0 rgba(255,255,255,0.06),
                inset 0 0 0 1px rgba(255,255,255,0.025);
        }

        /* Shimmer top line */
        .table-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            z-index: 2;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(59,159,255,0.4) 30%,
                rgba(140,210,255,0.7) 50%,
                rgba(59,159,255,0.4) 70%,
                transparent 100%
            );
            background-size: 200% auto;
            animation: shimmer 6s linear infinite;
        }

        /* ── TABLE HEAD ── */
        .t-head {
            display: grid;
            grid-template-columns: 28% 1fr 16%;
            background: linear-gradient(180deg, rgba(59,159,255,0.07) 0%, rgba(59,159,255,0.02) 100%);
            border-bottom: 1px solid rgba(59,159,255,0.12);
            position: relative;
            z-index: 1;
        }

        .t-head div {
            padding: 14px 22px;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(59,159,255,0.60);
        }

        .t-head div:not(:last-child) {
            border-right: 1px solid rgba(59,159,255,0.08);
        }

        .t-head div:last-child { text-align: center; }

        /* ── TABLE BODY ── */
        .t-body {
            min-height: 360px;
            max-height: calc(100vh - 310px);
            overflow-y: auto;
        }

        /* ── ROW ── */
        .t-row {
            display: grid;
            grid-template-columns: 28% 1fr 16%;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            position: relative;
            transition: background .15s;
            animation: fadeUp .25s ease both;
        }

        .t-row:last-child { border-bottom: none; }

        /* Left accent bar */
        .t-row::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, var(--blue), transparent);
            opacity: 0;
            transition: opacity .2s;
        }

        /* Hover glow overlay */
        .t-row::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(59,159,255,0.06), transparent 60%);
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
        }

        .t-row:hover { background: rgba(59,159,255,0.03); }
        .t-row:hover::before { opacity: 1; }
        .t-row:hover::after  { opacity: 1; }
        .t-row:hover .col-provider { color: var(--blue); filter: drop-shadow(0 0 6px rgba(59,159,255,0.45)); }
        .t-row:hover .badge { background: rgba(59,159,255,0.18); color: #7ec8ff; border-color: rgba(59,159,255,0.35); }

        .t-row > div {
            padding: 14px 22px;
            font-size: 14px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .t-row > div:not(:last-child) {
            border-right: 1px solid rgba(255,255,255,0.04);
        }

        .t-row > div span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .col-provider {
            font-weight: 600;
            font-size: 13px;
            color: rgba(59,159,255,0.78);
            transition: color .2s, filter .2s;
        }

        .col-game {
            font-weight: 500;
            color: rgba(240,244,255,0.82);
            transition: color .15s;
        }

        .t-row:hover .col-game { color: rgba(240,244,255,0.96); }

        .col-type { justify-content: center; }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 11px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 600;
            background: linear-gradient(135deg, rgba(59,159,255,0.13), rgba(59,159,255,0.06));
            color: rgba(59,159,255,0.72);
            border: 1px solid rgba(59,159,255,0.20);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
            transition: background .2s, color .2s, border-color .2s;
            white-space: nowrap;
        }

        /* ── FOOTER ── */
        .table-footer {
            padding: 10px 22px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid rgba(59,159,255,0.08);
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 1;
        }

        .table-footer b {
            color: rgba(59,159,255,0.90);
            font-weight: 700;
            text-shadow: 0 0 8px rgba(59,159,255,0.4);
        }

        /* ── STATE BOXES ── */
        .state-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 90px 20px;
            text-align: center;
            color: var(--muted);
        }

        .state-icon {
            width: 68px; height: 68px;
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            margin-bottom: 4px;
        }

        .state-icon.blue {
            background: linear-gradient(135deg, rgba(59,159,255,0.15), rgba(30,100,220,0.08));
            border: 1px solid rgba(59,159,255,0.25);
            box-shadow: 0 0 30px rgba(59,159,255,0.20);
            color: var(--blue);
        }

        .state-icon.red {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.25);
            box-shadow: 0 0 24px rgba(239,68,68,0.15);
            color: #ef4444;
        }

        .state-label {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
        }

        .state-sub { font-size: 13px; max-width: 340px; line-height: 1.6; }

        .btn-retry {
            margin-top: 6px;
            height: 40px;
            padding: 0 22px;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            color: var(--text);
            display: inline-flex; align-items: center; gap: 7px;
            transition: background .15s;
        }

        .btn-retry:hover { background: rgba(255,255,255,0.09); }

        /* ── ANIMATIONS ── */
        @keyframes shimmer {
            0%   { background-position: -200% center; }
            100% { background-position:  200% center; }
        }

        @keyframes floatBlob {
            0%, 100% { transform: translateY(0px) scale(1); }
            50%       { transform: translateY(-22px) scale(1.04); }
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(7px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .spin { animation: spin 1s linear infinite; }

        /* ── MOBILE ── */
        @media (max-width: 600px) {
            body { padding: 14px 12px 50px; }
            .header { height: auto; padding: 16px 18px; }
            .search-row { flex-direction: column; }
            .btn-refresh { width: 100%; justify-content: center; }
            .t-head, .t-row { grid-template-columns: 36% 1fr; }
            .t-head div:last-child, .t-row > div:last-child { display: none; }
        }
    </style>
</head>

<body>

<!-- Ambient glow blobs -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="wrap">

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-bolt"></i></div>
            <div class="logo-text">
                <h1>HOKIJITU</h1>
                <p>Game Search Platform</p>
            </div>
        </div>
        <div class="stat-box">
            <i class="fas fa-trophy"></i>
            <div class="stat-inner">
                <span>Total Games</span>
                <span id="totalGames">0</span>
            </div>
        </div>
    </div>

    <!-- SEARCH -->
    <div class="search-row">
        <div class="search-field">
            <i class="fas fa-search"></i>
            <input
                type="text"
                id="searchInput"
                placeholder="Cari Provider atau Nama Game..."
                oninput="searchGame()"
                onkeypress="handleEnter(event)"
            >
        </div>
        <button class="btn-refresh" id="refreshBtn" onclick="loadData()">
            <i class="fas fa-sync-alt" id="refreshIcon"></i>
            Refresh Data
        </button>
    </div>

    <!-- TABLE CARD -->
    <div class="table-card">

        <!-- Head -->
        <div class="t-head">
            <div>Provider</div>
            <div>Game Name</div>
            <div>Type</div>
        </div>

        <!-- Body -->
        <div class="t-body" id="tableBody">
            <div class="state-box">
                <div class="state-icon blue"><i class="fas fa-spinner spin"></i></div>
                <div class="state-label">Memuat data game...</div>
                <div class="state-sub">Mohon tunggu sebentar</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="table-footer" id="tableFooter" style="display:none">
            <b id="resultCount">0</b>
            <span id="resultLabel">total game</span>
        </div>

    </div>

</div>

<script>
    const API_URL   = 'https://script.google.com/macros/s/AKfycbzCZ37G6Xz57I75KKqUxj0BC5QXsQmuZiSLHLPpg_MKchuNic3-__e0WahuAtE-OHEONQ/exec';
    const CACHE_KEY = 'hokijitu_cache';
    const CACHE_TTL = 5 * 60 * 1000; // 5 menit

    let allData   = [];
    let isLoading = false;

    /* ── CACHE ── */
    function loadCache() {
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) return null;
            const { data, ts } = JSON.parse(raw);
            if (Date.now() - ts > CACHE_TTL) return null;
            return data;
        } catch { return null; }
    }

    function saveCache(data) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data, ts: Date.now() })); }
        catch { /* ignore */ }
    }

    /* ── LOAD ── */
    async function loadData(silent = false) {
        if (isLoading) return;
        isLoading = true;

        const btn  = document.getElementById('refreshBtn');
        const icon = document.getElementById('refreshIcon');
        btn.disabled = true;
        icon.classList.add('spin');

        if (!silent) showLoading();

        try {
            const res  = await fetch(API_URL);
            const json = await res.json();
            if (!json.success) throw new Error(json.error || 'API error');

            allData = json.data;
            saveCache(allData);
            document.getElementById('totalGames').textContent = allData.length.toLocaleString();
            searchGame();

        } catch (err) {
            if (!silent) showError(err.message);
        } finally {
            isLoading = false;
            btn.disabled = false;
            icon.classList.remove('spin');
        }
    }

    /* ── SEARCH ── */
    function searchGame() {
        const kw = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = kw
            ? allData.filter(r =>
                r.provider.toLowerCase().includes(kw) ||
                r.gameName.toLowerCase().includes(kw))
            : allData;
        renderRows(filtered, !!kw);
    }

    function handleEnter(e) { if (e.key === 'Enter') searchGame(); }

    /* ── RENDER ── */
    function renderRows(data, isSearch) {
        const body   = document.getElementById('tableBody');
        const footer = document.getElementById('tableFooter');
        const cnt    = document.getElementById('resultCount');
        const lbl    = document.getElementById('resultLabel');

        if (data.length === 0) {
            body.innerHTML = `
                <div class="state-box">
                    <div class="state-icon blue"><i class="fas fa-gamepad"></i></div>
                    <div class="state-label">Game tidak ditemukan</div>
                    <div class="state-sub">Coba kata kunci yang berbeda.</div>
                </div>`;
            footer.style.display = 'none';
            return;
        }

        body.innerHTML = data.map((row, i) => `
            <div class="t-row" style="animation-delay:${Math.min(i * 0.022, 0.55)}s">
                <div class="col-provider"><span>${esc(row.provider)}</span></div>
                <div class="col-game"><span>${esc(row.gameName)}</span></div>
                <div class="col-type"><span class="badge">${esc(row.type)}</span></div>
            </div>
        `).join('');

        cnt.textContent  = data.length.toLocaleString();
        lbl.textContent  = isSearch ? 'hasil ditemukan' : 'total game';
        footer.style.display = 'flex';
    }

    /* ── STATE HELPERS ── */
    function showLoading() {
        document.getElementById('tableFooter').style.display = 'none';
        document.getElementById('tableBody').innerHTML = `
            <div class="state-box">
                <div class="state-icon blue"><i class="fas fa-spinner spin"></i></div>
                <div class="state-label">Memuat data game...</div>
                <div class="state-sub">Mohon tunggu sebentar</div>
            </div>`;
    }

    function showError(msg) {
        document.getElementById('tableFooter').style.display = 'none';
        document.getElementById('tableBody').innerHTML = `
            <div class="state-box">
                <div class="state-icon red"><i class="fas fa-exclamation-triangle"></i></div>
                <div class="state-label">Koneksi Gagal</div>
                <div class="state-sub">${esc(msg)}</div>
                <button class="btn-retry" onclick="loadData()">
                    <i class="fas fa-redo"></i> Coba Lagi
                </button>
            </div>`;
    }

    function esc(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    /* ── INIT ── */
    (function init() {
        const cached = loadCache();
        if (cached && cached.length > 0) {
            allData = cached;
            document.getElementById('totalGames').textContent = allData.length.toLocaleString();
            searchGame();
            // Refresh in background silently
            loadData(true);
        } else {
            loadData(false);
        }
    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Search Game Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="scan-line"></div>

<!-- ===================== HEADER ===================== -->
<header>
  <div class="header-accent"></div>
  <div class="header-inner">

    <div class="logo-area">
      <div class="logo-wrap">
        <div class="logo-halo"></div>
        <div class="logo-icon">🎮</div>
      </div>
      <div class="brand">
        <h1>SEARCH GAME DASHBOARD</h1>
        <p>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="2" y="2" width="8" height="8" rx="1"/>
            <rect x="14" y="2" width="8" height="8" rx="1"/>
            <rect x="2" y="14" width="8" height="8" rx="1"/>
            <rect x="14" y="14" width="8" height="8" rx="1"/>
          </svg>
          Game Catalog
        </p>
      </div>
    </div>

    <div class="header-right">
      <div class="stats-badge">
        <span class="hash">#</span>
        <span class="count" id="totalCount">0</span>
        <span class="label">Games</span>
      </div>
      <button class="btn-add" id="btnAddGame">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Tambah Game
      </button>
    </div>

  </div>
</header>

<!-- ===================== MAIN ===================== -->
<main>

  <!-- Filters -->
  <div class="filters">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Cari nama game atau provider..." autocomplete="off" />
    </div>

    <div class="select-wrap">
      <select id="providerFilter">
        <option value="">Semua Provider</option>
      </select>
      <span class="select-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
    </div>

    <div class="select-wrap-sm">
      <select id="typeFilter">
        <option value="">Semua Tipe</option>
      </select>
      <span class="select-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
    </div>

    <button class="btn-csv" id="btnExportCsv" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span id="csvLabel">CSV</span>
    </button>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-top-rim"></div>

    <div class="col-header">
      <div class="col-header-cell">
        <span class="col-label">PROVIDER</span>
        <span class="col-sub">Penyedia Game</span>
        <div class="col-bottom-accent"></div>
      </div>
      <div class="col-header-cell">
        <span class="col-label">NAMA GAME</span>
        <span class="col-sub">Judul Permainan</span>
        <div class="col-bottom-accent"></div>
      </div>
      <div class="col-header-cell">
        <span class="col-label">TIPE</span>
        <span class="col-sub">Kategori</span>
        <div class="col-bottom-accent"></div>
      </div>
    </div>

    <div id="tableBody"></div>
    <div id="pagination" class="pagination" style="display:none"></div>
  </div>

</main>

<!-- ===================== MODAL TAMBAH GAME ===================== -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">Tambah Game Baru</h2>
      <button class="btn-close-modal" id="btnCloseModal" aria-label="Tutup">✕</button>
    </div>

    <form id="formAddGame" novalidate>
      <div class="modal-body">

        <div class="form-group">
          <label for="inputProvider">Provider</label>
          <input type="text" id="inputProvider" list="providerList" placeholder="Contoh: Pragmatic Play" />
          <datalist id="providerList"></datalist>
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="inputNamaGame">Nama Game</label>
          <input type="text" id="inputNamaGame" placeholder="Contoh: Sweet Bonanza" />
          <span class="field-error"></span>
        </div>

        <div class="form-group">
          <label for="inputTipeGame">Tipe Game</label>
          <input type="text" id="inputTipeGame" list="tipeGameList" placeholder="Contoh: Slot" />
          <datalist id="tipeGameList"></datalist>
          <span class="field-error"></span>
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" id="btnCancelModal">Batal</button>
        <button type="submit" class="btn-submit" id="btnSubmit">Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- ===================== TOAST ===================== -->
<div class="toast-container" id="toastContainer"></div>

<script src="script.js"></script>
</body>
</html>
